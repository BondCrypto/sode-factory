# BAD FIXTURE: unknown stage key 'deploy' -> schema MUST refuse this (do not fix).
schema_version: 1
policy_profile: local
isolation: clone
secrets_broker: none
secrets_registry: platform/policy/secrets.yaml
targets:
  self:
    path: .
    default_branch: main
    setup: make setup
    test_cmd: make test
    cache:
      dir: .sode/cache/self
      key:
      - lockfile_hash
    healthcheck: sode doctor --target self
    gate:
      t0:
      - lint
      - types
      - unit_changed
      t1:
      - all
git: platform/policy/git.yaml
reserve_pct: 15
runners:
  local_clone:
    isolation: clone
    watchdog:
      heartbeat_s: 120
      no_output_s: 900
      wall_clock_s: 7200
automations: []
integrations:
  github:
    mode: pr_view
  chat: null
decision_model: null
scorers:
  sample_rate: 0.25
  dimensions:
  - task_compliance
  - procedure_compliance
  - verbosity
  - efficiency
  - code_quality
providers:
  anthropic_cli:
    adapter: claude_code_cli
    billing: subscription
    families:
    - claude
    tools:
    - bash
    - edit
    - read
    hooks: claude_hooks
  openai_cli:
    adapter: codex_cli
    billing: subscription
    families:
    - gpt
    tools:
    - bash
    - edit
    - read
    hooks: codex_config
  mock:
    adapter: mock
    billing: none
    families:
    - mock
stages:
  spec:
    provider: mock
    model: null
    permission: plan_only
    budget:
      rate_pct: 3
      cost_m: 0.5
    max_attempts: 2
    secrets: []
  implement:
    provider: mock
    model: null
    permission: edit_in_clone
    budget:
      rate_pct: 8
      cost_m: 2.0
    max_attempts: 3
    secrets: []
  review:
    provider: mock
    model: null
    permission: read_only
    budget:
      rate_pct: 2
      cost_m: 0.5
    max_attempts: 1
    secrets: []
    cross_family_required: false
  verify:
    provider: none
  ship:
    provider: none
  deploy:
    provider: none
