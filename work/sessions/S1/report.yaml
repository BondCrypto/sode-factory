decisions:
  - what: "kind_for_filename falls back to the first '_'-delimited segment of the stem."
    why: "The spec names the one-version-behind fixture `prediction_v1`; `sode migrate --path .../prediction_v1.jsonl` must resolve the kind without --kind. Stem was `prediction_v1`, not in FILENAME_KIND, so kind inference returned None and the documented acceptance command failed."
    alternatives_rejected: "Require --kind on the acceptance command (adds an undocumented flag); prefix-match every known kind (fragile — e.g. 'local_backup' would match 'local')."
  - what: "`make test` excludes tests/test_standalone.py; a separate `standalone`/`test-all` target runs it."
    why: "The standalone test copies the tree and runs `make test` inside the copy. If `make test` included it, that would recurse infinitely. Excluding it from the fast gate keeps the copied gate non-recursive while `python3 -m pytest tests/ -q` still runs everything."
    alternatives_rejected: "A nested-run env guard that skips the e2e when nested — that is a skip marker, which the brief forbids."
  - what: "The standalone test repoints HOME at a throwaway dir but injects the interpreter's real site-packages via PYTHONPATH and pins PY=sys.executable."
    why: "pytest and PyYAML are installed in the user site under $HOME; a bare temp HOME hid them and `make test` failed with 'No module named pytest'. The temp HOME still catches repo code that reads a machine-local path; the Python toolchain is an environment concern, not a repo concern (a real fresh clone runs `pip install -r requirements.txt`)."
    alternatives_rejected: "Leave HOME unchanged (weakens the machine-local-leak check); vendor the deps (out of scope)."
  - what: "Added README.md to the grep-clean scan set (platform/core/repo.py)."
    why: "README is the first file a clone shows; section 1.4(3) says the tree greps clean. docs/ and CLAUDE.md stay out of scope because they document the sibling relationship."
    alternatives_rejected: "Leave README unscanned (a foreign token could slip into the most-read file)."

concerns:
  - "The repo package is named `platform`, which shadows the stdlib `platform` module. It works today (CLI + pytest verified) because no factory code imports the stdlib module and conftest puts the repo root first, but it is fragile: a future pytest plugin that imports stdlib `platform` after collection could break test imports. Documented in platform/__init__.py. This is a LOCKED taxonomy choice (section 1.6), so not re-decided here."
  - "factory.yaml references platform/policy/secrets.yaml which does not exist yet (C4/S3 owns it). Safe at S1 (local profile skips it), but doctor in `standard`/`restricted` would FAIL until S3 lands it."
  - "The machine runs Python 3.14.7; the spec language target is 3.12. Nothing 3.13/3.14-specific is used, but the version is unpinned."

assumptions:
  - "PyYAML (>=6) is installed for the interpreter that runs `make test` (present here via the user site; pinned in requirements.txt)."
  - "`make` and `git` (>=2.40) are on PATH; verified locally (git 2.50)."
  - "jsonschema is NOT required — the factory uses the in-tree platform.schema.validate; confirmed jsonschema is absent and unused."

rejected_paths:
  - "Adding a jsonschema dependency — the in-tree dependency-free validator covers the schema subset the factory uses; keeps the clone offline and stdlib-first."
  - "A pytest.ini / pyproject.toml to set import mode — the existing conftest.py sys.path shim plus test packages (__init__.py) resolve imports without a new top-level config file."

