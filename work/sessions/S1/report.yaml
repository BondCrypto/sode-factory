  - "S3: add platform/policy/secrets.yaml + its schema so doctor passes in standard/restricted."
  - "S6 (C7): fold the four gate_bootstrap checks into the real gate registry with the ratchet; keep the remediation-per-check + BAD-fixture contract."
  - "Harden conftest.py (or reconsider the `platform` package name) against a future stdlib-platform shadow; or pin the interpreter."
